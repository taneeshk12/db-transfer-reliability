# PostgreSQL 16 for the curated star schema.
# Credentials and port come from .env (copy .env.example -> .env).
services:
  db:
    image: postgres:16-alpine
    container_name: dbtr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Server runs in UTC; Europe/Berlin conversion happens explicitly in the pipeline
      # so DST changes are handled in one place.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
